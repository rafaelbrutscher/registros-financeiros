name: Deploy Homolog

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  deploy:
    name: Deploy to Homolog
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          APP_KEY_HOMOLOG: ${{ secrets.APP_KEY_HOMOLOG }}
          DB_PASSWORD_HOMOLOG: ${{ secrets.DB_PASSWORD_HOMOLOG }}
          DB_ROOT_PASSWORD_HOMOLOG: ${{ secrets.DB_ROOT_PASSWORD_HOMOLOG }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          envs: APP_KEY_HOMOLOG,DB_PASSWORD_HOMOLOG,DB_ROOT_PASSWORD_HOMOLOG
          script: |
            cd /opt/app/registros-financeiros
            git pull origin main

            cat > infra/homolog/.env << EOF
            APP_KEY=${APP_KEY_HOMOLOG}
            APP_ENV=staging
            APP_URL=http://177.44.248.118:8090
            APP_DEBUG=true
            DB_CONNECTION=mysql
            DB_HOST=mariadb
            DB_PORT=3306
            DB_DATABASE=registros_financeiros_homolog
            DB_USERNAME=laravel
            DB_PASSWORD=${DB_PASSWORD_HOMOLOG}
            DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD_HOMOLOG}
            MAIL_MAILER=smtp
            MAIL_HOST=mailpit
            MAIL_PORT=1025
            MAIL_FROM_ADDRESS=noreply@homolog.local
            MAIL_FROM_NAME="Registros Financeiros - Homolog"
            LOG_CHANNEL=stderr
            LOG_LEVEL=warning
            IMAGE_TAG=latest
            EOF

            docker compose -f infra/homolog/docker-compose.yml pull app
            docker compose -f infra/homolog/docker-compose.yml up -d

            echo "Aguardando app ficar healthy (ate 120s)..."
            ELAPSED=0
            until [ "$(docker inspect --format='{{.State.Health.Status}}' homolog_app 2>/dev/null)" = "healthy" ]; do
              if [ "$ELAPSED" -ge 120 ]; then
                echo "ERRO: app nao ficou healthy em 120s. Ultimas linhas do log:"
                docker logs homolog_app --tail 50
                exit 1
              fi
              sleep 5
              ELAPSED=$((ELAPSED + 5))
            done
            echo "Deploy de homolog concluido com sucesso!"
