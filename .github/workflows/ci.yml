name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  checks: write
  pull-requests: write

jobs:
  quality:
    name: Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3 with PCOV
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, intl, zip, bcmath
          coverage: pcov

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan level 5)
        run: vendor/bin/phpstan analyse --memory-limit=512M

      - name: Run tests with coverage
        env:
          APP_KEY: base64:dGVzdGtleWZvcmNpcGlwZWxpbmV0ZXN0aW5nMTIzNDU=
        run: php artisan test --log-junit junit.xml --coverage-clover coverage.xml

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: PHPUnit Results
          path: junit.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            junit.xml
            coverage.xml

  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Extract short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ghcr.io/rafaelbrutscher/registros-financeiros:sha-${{ steps.sha.outputs.short }}
            ghcr.io/rafaelbrutscher/registros-financeiros:latest
