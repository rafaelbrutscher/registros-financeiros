name: Deploy Prod

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag SHA da imagem (ex: sha-abc1234)"
        required: true

jobs:
  deploy:
    name: Deploy to Prod
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          APP_KEY_PROD: ${{ secrets.APP_KEY_PROD }}
          DB_PASSWORD_PROD: ${{ secrets.DB_PASSWORD_PROD }}
          DB_ROOT_PASSWORD_PROD: ${{ secrets.DB_ROOT_PASSWORD_PROD }}
          IMAGE_TAG_INPUT: ${{ github.event.inputs.image_tag }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          envs: APP_KEY_PROD,DB_PASSWORD_PROD,DB_ROOT_PASSWORD_PROD,IMAGE_TAG_INPUT
          script: |
            cd /opt/app/registros-financeiros
            git pull origin main

            cat > infra/prod/.env << EOF
            APP_KEY=${APP_KEY_PROD}
            APP_ENV=production
            APP_URL=http://177.44.248.118:8091
            APP_DEBUG=false
            DB_CONNECTION=mysql
            DB_HOST=mariadb
            DB_PORT=3306
            DB_DATABASE=registros_financeiros_prod
            DB_USERNAME=laravel
            DB_PASSWORD=${DB_PASSWORD_PROD}
            DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD_PROD}
            MAIL_MAILER=smtp
            MAIL_HOST=mailpit
            MAIL_PORT=1025
            MAIL_FROM_ADDRESS=noreply@prod.local
            MAIL_FROM_NAME="Registros Financeiros - Prod"
            LOG_CHANNEL=stderr
            LOG_LEVEL=warning
            IMAGE_TAG=${IMAGE_TAG_INPUT}
            EOF

            docker compose -f infra/prod/docker-compose.yml pull app
            docker compose -f infra/prod/docker-compose.yml up -d

            echo "Aguardando app ficar healthy (ate 120s)..."
            ELAPSED=0
            until [ "$(docker inspect --format='{{.State.Health.Status}}' prod_app 2>/dev/null)" = "healthy" ]; do
              if [ "$ELAPSED" -ge 120 ]; then
                echo "ERRO: app nao ficou healthy em 120s. Ultimas linhas do log:"
                docker logs prod_app --tail 50
                exit 1
              fi
              sleep 5
              ELAPSED=$((ELAPSED + 5))
            done
            echo "Deploy de prod concluido com sucesso!"
